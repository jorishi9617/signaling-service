version: "1"

services:
  - type: web
    name: jorishi9617-video-platform-token
    runtime: docker
    repo: https://github.com/jorishi9617/common-library
    branch: master
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: API_KEY
        fromGroup: video-platform-secrets
      - key: JWT_SECRET
        fromGroup: video-platform-secrets
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC

  - type: web
    name: jorishi9617-video-platform-auth
    runtime: docker
    repo: https://github.com/jorishi9617/auth-service
    branch: master
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_HOST
        fromDatabase:
          name: video-platform-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: video-platform-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: video-platform-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: video-platform-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: video-platform-db
          property: password
      - key: JWT_SECRET
        fromGroup: video-platform-secrets
      - key: FRONTEND_ORIGINS
        value: https://jorishi9617-video-platform-web.onrender.com
      - key: SECURITY_LOCAL_TEST_ENABLED
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC

  - type: web
    name: jorishi9617-video-platform-call
    runtime: docker
    repo: https://github.com/jorishi9617/call-service
    branch: master
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: video-platform-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: video-platform-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: video-platform-db
          property: password
      - key: SECURITY_JWT_SECRET
        fromGroup: video-platform-secrets
      - key: FRONTEND_ORIGINS
        value: https://jorishi9617-video-platform-web.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC

  - type: web
    name: jorishi9617-video-platform-signaling
    runtime: docker
    repo: https://github.com/jorishi9617/signaling-service
    branch: master
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        fromGroup: video-platform-secrets
      - key: FRONTEND_ORIGINS
        value: https://jorishi9617-video-platform-web.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC

  - type: web
    name: jorishi9617-video-platform-web
    runtime: docker
    repo: https://github.com/jorishi9617/frontend-web
    branch: master
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /

databases:
  - name: video-platform-db
    databaseName: video_platform
    user: video
    plan: free
    postgresMajorVersion: "17"

envVarGroups:
  - name: video-platform-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
